name: Cleanup old Cloudflare Pages deployments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-cloudflare-deployments.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Keep newest 10 deployments and remove old ones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: amura-engine-2
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const project = process.env.CLOUDFLARE_PROJECT_NAME;
          const keepCount = 10;

          if (!token || !accountId || !project) {
            throw new Error('Faltan credenciales/configuración de Cloudflare');
          }

          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}/deployments`;
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };

          async function cf(url, options = {}) {
            const res = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const text = await res.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch (_) {}
            if (!res.ok || (body && body.success === false)) {
              const detail = body?.errors?.map(e => e.message).join('; ') || text || `${res.status}`;
              throw new Error(`${res.status} ${detail}`);
            }
            return body;
          }

          const deployments = [];
          for (let page = 1; page <= 20; page++) {
            const body = await cf(`${base}?page=${page}&per_page=100`);
            const batch = Array.isArray(body?.result) ? body.result : [];
            deployments.push(...batch);
            const totalPages = Number(body?.result_info?.total_pages || 0);
            if (!batch.length || (totalPages && page >= totalPages) || batch.length < 100) break;
          }

          deployments.sort((a, b) => new Date(b.created_on || 0) - new Date(a.created_on || 0));
          console.log(`Deployments encontrados: ${deployments.length}`);

          const keep = new Set(deployments.slice(0, keepCount).map(d => d.id));
          let deleted = 0;
          let skippedProtected = 0;
          let failed = 0;

          for (const d of deployments.slice(keepCount)) {
            const aliases = Array.isArray(d.aliases) ? d.aliases.filter(Boolean) : [];
            if (aliases.length) {
              skippedProtected++;
              console.log(`PROTEGIDO ${d.id} · aliases: ${aliases.join(', ')}`);
              continue;
            }
            try {
              await cf(`${base}/${d.id}?force=true`, { method: 'DELETE' });
              deleted++;
              console.log(`BORRADO ${d.id} · ${d.created_on || ''}`);
            } catch (err) {
              failed++;
              console.log(`NO BORRADO ${d.id} · ${err.message}`);
            }
          }

          console.log(`Resumen: conservados recientes=${Math.min(keepCount, deployments.length)}, protegidos por alias=${skippedProtected}, borrados=${deleted}, fallidos=${failed}`);
          if (failed) process.exitCode = 1;
          NODE
