name: Finalize R18.1.1 UI ownership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-r181-visible-version.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stop bank boot from rewriting main UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('site/static-bank-player-r16.js')
          s = p.read_text()
          old = 'function boot(){ensure();const e=document.querySelector("#startPanel .eyebrow"),t=document.getElementById("cameraTitle"),l=document.getElementById("statusMessage"),p=document.querySelector("#startPanel .privacy");if(e)e.textContent="LABORATORIO · R18.1.1";if(t)t.textContent="RELOJ + MUÑECA SOBRE R17.2";if(l)l.textContent="Rig rígido AR-02 sobre el eje naranja. Z calibrada una vez al pulsar LISTO.";if(p)p.textContent="Muñeca transparente por defecto · cuatro modos · autorrescate compartido por todo el rig.";document.title="AMURA · WRIST RIG · R18.1.1";}'
          new = 'function boot(){ensure();}'
          if old not in s:
              raise SystemExit('Expected boot() body not found; refusing to guess')
          s = s.replace(old, new, 1)
          p.write_text(s)

          check = p.read_text()
          forbidden = [
              '#startPanel .eyebrow',
              'getElementById("cameraTitle")',
              'getElementById("statusMessage")',
              '#startPanel .privacy'
          ]
          tail = check[check.index('function boot()'):]
          bad = [x for x in forbidden if x in tail]
          if bad:
              raise SystemExit('boot still rewrites main UI: ' + repr(bad))
          print('boot() now only initializes bank UI')
          PY
      - name: Commit final R18.1.1 UI fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/static-bank-player-r16.js
          git commit -m 'R18.1.1 let index own main UI labels'
          git push
