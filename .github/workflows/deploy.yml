name: Deploy AMURA AR to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact current V2.8 final HTML
        run: npm run build

      - name: Freeze V272 runtime assets to fixed Pages origin
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create amura-assets-v272-coette --production-branch=main || true
          npx --yes wrangler@latest pages deploy dist --project-name=amura-assets-v272-coette --branch=main

      - name: Consolidate final HTML and remove patch chain
        run: |
          node consolidate-once.mjs
          node --check build.mjs
          grep -q 'BUILD V2.9 · PHYSICAL ANCHOR DIAGNOSTIC · TOP3' index.html
          grep -q 'x.landmarksOk&&x.ref.n>=10' index.html
          grep -q 'casePxWork:canonicalCasePxWork' index.html
          grep -q 'watchAnchor:f.watchAnchor' index.html
          grep -q 'score:T.inliers\*7-T.meanErr\*2.2' index.html
          grep -q 'const topCandidates=candidates.slice(0,3)' index.html
          test ! -e build-v2.mjs
          test ! -e build-v2-keyframes.mjs
          test ! -e build-v2-anchor.mjs
          test ! -e build-v2-center-anchor.mjs
          test ! -e consolidate-once.mjs

      - name: Commit consolidated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate V2.9 physical anchor diagnostic"
          git push origin HEAD:main

      - name: Deploy consolidated diagnostic
        run: npx --yes wrangler@latest pages deploy dist --project-name=amura-engine-2 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
