name: Export Engine 4 clean base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-engine4-base.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact stable R18.1.2 site
        shell: bash
        run: |
          set -euo pipefail
          STABLE=fc78ef06f1ca19158ebd20337d4652aa848b6d08
          rm -rf /tmp/engine4-base
          mkdir -p /tmp/engine4-base
          git archive "$STABLE" site | tar -x -C /tmp/engine4-base
          cd /tmp/engine4-base/site
          test -f index.html
          grep -q 'R18.1.2' index.html
          zip -r -9 "$GITHUB_WORKSPACE/AMURA_ENGINE_4_R1_CLOUDFLARE.zip" .

      - name: Upload clean Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AMURA_ENGINE_4_R1_CLOUDFLARE
          path: AMURA_ENGINE_4_R1_CLOUDFLARE.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish run id
        shell: bash
        run: |
          cat > engine4-export-run.json <<EOF
          {"run_id":${GITHUB_RUN_ID},"stable":"fc78ef06f1ca19158ebd20337d4652aa848b6d08","artifact":"AMURA_ENGINE_4_R1_CLOUDFLARE"}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine4-export-run.json
          git commit -m 'Record Engine 4 clean export run' || exit 0
          git push
