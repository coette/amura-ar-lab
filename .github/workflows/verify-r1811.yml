name: Verify R18.1.1 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-r1811.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare production and runtime files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sleep 25
          BASE='https://amura-engine-2.pages.dev'
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/amura-engine-2"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          HTML=$(curl -fsS "$BASE/?verify=r1811")
          BANK=$(curl -fsS "$BASE/static-bank-player-r16.js?v=r18.1.1")
          AXIS=$(curl -fsS "$BASE/axis-r16-live.js?v=r18.1.1")
          LIST=$(curl -fsS "$API/deployments" -H "$AUTH")
          COUNT=$(printf '%s' "$LIST" | jq -r '.result_info.total_count // (.result|length)')
          ACTIVE=$(curl -fsS "$API" -H "$AUTH" | jq -r '.result.latest_deployment.id')

          printf '%s' "$HTML" | grep -q 'R18.1.1'
          printf '%s' "$BANK" | grep -Fq 'function boot(){ensure();}'
          ! printf '%s' "$BANK" | grep -Fq 'LABORATORIO · R16'
          ! printf '%s' "$BANK" | grep -Fq 'document.title="AMURA · R16"'
          ! printf '%s' "$AXIS" | grep -Fq 'R16 OFICIAL · VERDE:'
          [ "$COUNT" -eq 1 ]

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg active "$ACTIVE" \
            --argjson deploymentCount "$COUNT" \
            '{generatedAt:$generatedAt,revision:"R18.1.1",deploymentCount:$deploymentCount,activeDeployment:$active,publicHtmlR1811:true,bankBootOnlyEnsure:true,noVisibleR16InBank:true,noVisibleR16InAxisHint:true}' \
            > cloudflare-diagnosis.json
          cat cloudflare-diagnosis.json

      - name: Save verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-diagnosis.json
          git commit -m 'Verify R18.1.1 production runtime' || exit 0
          git push
