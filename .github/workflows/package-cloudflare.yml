name: Package Cloudflare ZIP

on:
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build full package
        run: |
          npm run build
          cd dist
          zip -r ../AMURA_CLAUDE_V1_8_CLOUDFLARE.zip .
      - name: Upload Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: amura-claude-v1-8-cloudflare
          path: AMURA_CLAUDE_V1_8_CLOUDFLARE.zip
          if-no-files-found: error
