name: Cleanup Cloudflare Pages to one deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-cloudflare-deployments.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Keep only active production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: amura-engine-2
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const project = process.env.CLOUDFLARE_PROJECT_NAME;

          if (!token || !accountId || !project) {
            throw new Error('Faltan credenciales/configuración de Cloudflare');
          }

          const projectUrl = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}`;
          const deploymentsUrl = `${projectUrl}/deployments`;
          const headers = {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          };

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function cf(url, options = {}) {
            const res = await fetch(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });
            const text = await res.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch (_) {}
            if (!res.ok || (body && body.success === false)) {
              const detail = body?.errors?.map(e => e.message).join('; ') || text || `${res.status}`;
              throw new Error(`${res.status} ${detail}`);
            }
            return body;
          }

          async function listAll() {
            const all = [];
            for (let page = 1; page <= 30; page++) {
              const body = await cf(`${deploymentsUrl}?page=${page}&per_page=100`);
              const batch = Array.isArray(body?.result) ? body.result : [];
              all.push(...batch);
              const totalPages = Number(body?.result_info?.total_pages || 0);
              if (!batch.length || (totalPages && page >= totalPages) || batch.length < 100) break;
            }
            return all;
          }

          async function activeProductionId() {
            const body = await cf(projectUrl);
            const id = body?.result?.latest_deployment?.id;
            if (!id) throw new Error('Cloudflare no informa latest_deployment');
            return id;
          }

          async function cleanupRound(label) {
            const activeId = await activeProductionId();
            const deployments = await listAll();
            deployments.sort((a, b) => new Date(b.created_on || 0) - new Date(a.created_on || 0));
            console.log(`${label}: encontrados=${deployments.length} · producción activa=${activeId}`);

            let deleted = 0;
            let failed = 0;
            for (const d of deployments) {
              if (!d?.id || d.id === activeId) continue;
              try {
                await cf(`${deploymentsUrl}/${d.id}?force=true`, { method: 'DELETE' });
                deleted++;
                console.log(`BORRADO ${d.id} · ${d.created_on || ''}`);
              } catch (error) {
                failed++;
                console.log(`NO BORRADO ${d.id} · ${error.message}`);
              }
            }
            console.log(`${label}: borrados=${deleted} · fallidos=${failed}`);
            return { activeId, failed };
          }

          // Este push también dispara el deploy normal. Esperamos a que termine
          // antes de elegir qué implementación es la producción que hay que conservar.
          console.log('Esperando 60 s a que termine cualquier despliegue en curso...');
          await sleep(60000);
          await cleanupRound('RONDA 1');

          // Segunda pasada para capturar cualquier deployment que hubiese terminado
          // justo durante la primera limpieza.
          await sleep(12000);
          await cleanupRound('RONDA 2');

          const finalActive = await activeProductionId();
          const remaining = await listAll();
          console.log(`FINAL: quedan=${remaining.length} · producción activa=${finalActive}`);
          for (const d of remaining) {
            console.log(`RESTANTE ${d.id} · ${d.created_on || ''} · ${d.environment || ''}`);
          }

          if (remaining.length !== 1 || remaining[0]?.id !== finalActive) {
            throw new Error(`La limpieza no terminó en una sola implementación activa. Quedan ${remaining.length}.`);
          }
          NODE
