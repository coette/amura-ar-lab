name: Deploy AMURA Engine 4 bridge

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'engine4-deploy-status.txt'
  workflow_dispatch:

concurrency:
  group: amura-engine-4-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: amura-engine-4
      PROD_URL: https://amura-engine-4.pages.dev
    steps:
      - name: Checkout deployment bridge
        uses: actions/checkout@v4

      - name: Fetch Engine 4 main
        shell: bash
        run: |
          rm -rf engine4-source dist
          git clone --depth 1 --branch main https://github.com/coette/amura-engine-4.git engine4-source
          mkdir dist
          rsync -a --delete --exclude='.git' --exclude='.github' engine4-source/ dist/
          SOURCE_SHA=$(git -C engine4-source rev-parse HEAD)
          REVISION=$(grep -oE 'ENGINE 4 · R[0-9]+\.[0-9]+' engine4-source/index.html | head -n 1 | sed 's/ENGINE 4 · //')
          [ -n "$REVISION" ] || { echo 'Revision not found'; exit 1; }
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Deploying $REVISION from $SOURCE_SHA"

      - name: Deploy Engine 4 to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=amura-engine-4 --branch=main

      - name: Verify public revision
        shell: bash
        run: |
          set -e
          for attempt in $(seq 1 30); do
            BODY=$(curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/?verify=$SOURCE_SHA-$attempt" || true)
            if printf '%s' "$BODY" | grep -Fq "ENGINE 4 · $REVISION"; then
              echo "Verified $REVISION"
              exit 0
            fi
            sleep 5
          done
          echo "Production did not expose $REVISION"
          exit 1

      - name: Keep only current Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          PROJECT_JSON=$(curl -fsS "$API" -H "$AUTH")
          ACTIVE=$(printf '%s' "$PROJECT_JSON" | jq -r '.result.latest_deployment.id // empty')
          [ -n "$ACTIVE" ] || { echo 'No active deployment'; exit 1; }
          for round in $(seq 1 30); do
            JSON=$(curl -fsS "$API/deployments" -H "$AUTH")
            TOTAL=$(printf '%s' "$JSON" | jq -r '.result_info.total_count // (.result|length)')
            [ "$TOTAL" -le 1 ] && break
            while read -r ID; do
              [ -z "$ID" ] && continue
              [ "$ID" = "$ACTIVE" ] && continue
              curl -fsS -X DELETE "$API/deployments/$ID?force=true" -H "$AUTH" >/dev/null
            done < <(printf '%s' "$JSON" | jq -r '.result[].id')
            sleep 1
          done
          FINAL=$(curl -fsS "$API/deployments" -H "$AUTH")
          FINAL_TOTAL=$(printf '%s' "$FINAL" | jq -r '.result_info.total_count // (.result|length)')
          [ "$FINAL_TOTAL" -eq 1 ] || { echo "Expected 1 deployment, got $FINAL_TOTAL"; exit 1; }
          echo "FINAL_TOTAL=$FINAL_TOTAL" >> "$GITHUB_ENV"

      - name: Record verified deployment
        shell: bash
        run: |
          printf 'revision=%s\nsource_sha=%s\nproduction_verified=yes\ndeployments=%s\nverified_at_utc=%s\n' "$REVISION" "$SOURCE_SHA" "$FINAL_TOTAL" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > engine4-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine4-deploy-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Engine 4 deployed: $REVISION"
            git push
          fi
