name: Export full AMURA AR source for Claude

on:
  push:
    branches:
      - export/claude-full-2026-08-19

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production main
        uses: actions/checkout@v4
        with:
          ref: 287a74173ba78e2040317596872f933fc413e379
          fetch-depth: 0

      - name: Build full repository ZIP
        run: |
          git archive --format=zip --output=AMURA_AR_FULL_287a7417.zip HEAD
          mkdir export
          mv AMURA_AR_FULL_287a7417.zip export/

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMURA_AR_FULL_287a7417
          path: export/AMURA_AR_FULL_287a7417.zip
          compression-level: 0
          retention-days: 1

      - name: Publish temporary Cloudflare preview
        run: npx --yes wrangler@latest pages deploy export --project-name=amura-engine-2 --branch=claude-export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
