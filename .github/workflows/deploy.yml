name: Package Claude V1.8

on:
  push:
    branches: [package/claude-v1-8]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build complete Cloudflare package
        run: |
          npm run build
          cd dist
          zip -r ../AMURA_CLAUDE_V1_8_CLOUDFLARE.zip .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: amura-claude-v1-8-cloudflare
          path: AMURA_CLAUDE_V1_8_CLOUDFLARE.zip
          if-no-files-found: error
