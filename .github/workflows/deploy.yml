name: Deploy AMURA AR to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'cleanup-result.txt'
      - 'export-run.json'
      - 'cloudflare-diagnosis.json'
  workflow_dispatch:

concurrency:
  group: amura-engine-2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build current lab
        run: npm run build

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=amura-engine-2 --branch=main

      - name: Delete every old Cloudflare Pages deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: amura-engine-2
        run: |
          set -u
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sleep 5

          for round in $(seq 1 40); do
            PROJECT_JSON=$(curl -fsS "$API" -H "$AUTH")
            ACTIVE=$(printf '%s' "$PROJECT_JSON" | jq -r '.result.latest_deployment.id // empty')
            [ -n "$ACTIVE" ] || { echo 'No active deployment id'; exit 1; }

            # Pages rejects per_page=100 for this endpoint/account. Use the
            # default page and keep refreshing page 1 while deletions pull
            # older deployments forward.
            JSON=$(curl -fsS "$API/deployments" -H "$AUTH")
            TOTAL=$(printf '%s' "$JSON" | jq -r '.result_info.total_count // (.result|length)')
            VISIBLE=$(printf '%s' "$JSON" | jq -r '.result|length')
            echo "Round $round · total=$TOTAL · visible=$VISIBLE · active=$ACTIVE"
            [ "$TOTAL" -le 1 ] && break

            while read -r ID; do
              [ -z "$ID" ] && continue
              [ "$ID" = "$ACTIVE" ] && continue
              RESPONSE=$(curl -sS -X DELETE "$API/deployments/$ID?force=true" -H "$AUTH")
              SUCCESS=$(printf '%s' "$RESPONSE" | jq -r '.success // false')
              if [ "$SUCCESS" = "true" ]; then
                echo "DELETED $ID"
              else
                echo "DELETE FAILED $ID :: $(printf '%s' "$RESPONSE" | jq -c '.errors // .')"
              fi
              sleep 0.20
            done < <(printf '%s' "$JSON" | jq -r '.result[].id')
            sleep 1
          done

          FINAL=$(curl -fsS "$API/deployments" -H "$AUTH")
          FINAL_TOTAL=$(printf '%s' "$FINAL" | jq -r '.result_info.total_count // (.result|length)')
          echo "FINAL TOTAL=$FINAL_TOTAL"
          printf '%s' "$FINAL" | jq -r '.result[] | "REMAINING \(.id) \(.created_on) \(.environment)"'
          [ "$FINAL_TOTAL" -eq 1 ] || exit 1
