name: Deploy AMURA AR to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create rollback tag
        run: |
          git tag -f rollback-bec8401-pre-consolidation bec84015a86bdc5956893e1517274736ef9b5ae7
          git push origin refs/tags/rollback-bec8401-pre-consolidation --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build current lab
        run: npm run build

      - name: Deploy to existing Cloudflare Pages project
        run: npx --yes wrangler@latest pages deploy dist --project-name=amura-engine-2 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
