name: Consolidate AMURA AR V2.9

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  consolidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate exact current V2.8 dist
        run: npm run build

      - name: Vendor exact V272 runtime assets into repository
        run: |
          rm -rf vendor_v272 models_v272
          cp -a dist/vendor_v272 ./vendor_v272
          cp -a dist/models_v272 ./models_v272
          test -f vendor_v272/opencv/opencv.js
          test -f vendor_v272/opencv/opencv.wasm
          test -f models_v272/hand_landmarker.task
          test -f models_v272/A1-Irontide-AR-diagnostic.glb

      - name: Consolidate final HTML and remove regex patch chain
        run: node consolidate-once.mjs

      - name: Replace build with local-only asset copy
        shell: bash
        run: |
          cat > build.mjs <<'EOF'
          import { rm, mkdir, copyFile, cp, writeFile } from 'node:fs/promises';

          const DIST='dist';
          await rm(DIST,{recursive:true,force:true});
          await mkdir(DIST,{recursive:true});
          await copyFile('index.html',`${DIST}/index.html`);
          await cp('vendor_v272',`${DIST}/vendor_v272`,{recursive:true});
          await cp('models_v272',`${DIST}/models_v272`,{recursive:true});
          await writeFile(`${DIST}/_headers`,`/*\n  Cache-Control: no-store, no-cache, must-revalidate\n\n/*.wasm\n  Content-Type: application/wasm\n  Cache-Control: public, max-age=31536000, immutable\n\n/*.glb\n  Cache-Control: public, max-age=31536000, immutable\n`);
          await writeFile(`${DIST}/BUILD.txt`,`AMURA AR V2.9 PHYSICAL ANCHOR DIAGNOSTIC TOP3\nassets=repository-v272\ntime=${new Date().toISOString()}\n`);
          console.log('Build consolidado: index.html + assets V272 versionados en el repo');
          EOF

          # consolidate-once.mjs genera también un workflow permanente, pero el propio
          # GITHUB_TOKEN no debe intentar modificar workflows. Lo restauramos y lo
          # cambiaremos desde fuera después de que el commit de consolidación exista.
          git checkout -- .github/workflows/deploy.yml

      - name: Validate consolidated repository build
        run: |
          grep -q 'BUILD V2.9 · PHYSICAL ANCHOR DIAGNOSTIC · TOP3' index.html
          grep -q 'x.landmarksOk&&x.ref.n>=10' index.html
          grep -q 'casePxWork:canonicalCasePxWork' index.html
          grep -q 'watchAnchor:f.watchAnchor' index.html
          grep -q 'score:T.inliers\*7-T.meanErr\*2.2' index.html
          grep -q 'const topCandidates=candidates.slice(0,3)' index.html
          test ! -e build-v2.mjs
          test ! -e build-v2-keyframes.mjs
          test ! -e build-v2-anchor.mjs
          test ! -e build-v2-center-anchor.mjs
          test ! -e consolidate-once.mjs
          grep -q '"build": "node build.mjs"' package.json
          grep -q "await cp('vendor_v272'" build.mjs
          grep -q 'assets=repository-v272' build.mjs
          rm -rf dist
          npm run build
          test -f dist/vendor_v272/opencv/opencv.wasm
          test -f dist/models_v272/A1-Irontide-AR-diagnostic.glb

      - name: Commit consolidated source and vendored assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate V2.9 physical anchor diagnostic"
          git push origin HEAD:main

      - name: Deploy consolidated diagnostic
        run: npx --yes wrangler@latest pages deploy dist --project-name=amura-engine-2 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
