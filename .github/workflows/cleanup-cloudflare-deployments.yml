name: Cleanup Cloudflare Pages to one deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-cloudflare-deployments.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete all deployments except active production
        id: cleanup
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: amura-engine-2
        run: |
          set -u
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          : > cleanup-result.txt
          echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a cleanup-result.txt

          FAIL=0
          for round in $(seq 1 40); do
            PROJECT_JSON=$(curl -sS "$API" -H "$AUTH")
            PROJECT_OK=$(printf '%s' "$PROJECT_JSON" | jq -r '.success // false')
            if [ "$PROJECT_OK" != "true" ]; then
              echo "PROJECT API ERROR: $(printf '%s' "$PROJECT_JSON" | jq -c '.errors // .')" | tee -a cleanup-result.txt
              FAIL=1
              break
            fi

            ACTIVE=$(printf '%s' "$PROJECT_JSON" | jq -r '.result.latest_deployment.id // empty')
            if [ -z "$ACTIVE" ]; then
              echo "ERROR: no active deployment id" | tee -a cleanup-result.txt
              FAIL=1
              break
            fi

            # IMPORTANT: Cloudflare Pages rejects per_page=100 here (error 8000024).
            # We intentionally use the endpoint with its default page size and repeat
            # page 1 until every old deployment has been removed.
            JSON=$(curl -sS "$API/deployments" -H "$AUTH")
            OK=$(printf '%s' "$JSON" | jq -r '.success // false')
            if [ "$OK" != "true" ]; then
              echo "LIST API ERROR: $(printf '%s' "$JSON" | jq -c '.errors // .')" | tee -a cleanup-result.txt
              FAIL=1
              break
            fi

            TOTAL=$(printf '%s' "$JSON" | jq -r '.result_info.total_count // (.result|length)')
            VISIBLE=$(printf '%s' "$JSON" | jq -r '.result|length')
            echo "ROUND $round total=$TOTAL visible=$VISIBLE active=$ACTIVE" | tee -a cleanup-result.txt
            [ "$TOTAL" -le 1 ] && break

            DELETED_THIS_ROUND=0
            while read -r ID; do
              [ -z "$ID" ] && continue
              [ "$ID" = "$ACTIVE" ] && continue
              RESPONSE=$(curl -sS -X DELETE "$API/deployments/$ID?force=true" -H "$AUTH")
              SUCCESS=$(printf '%s' "$RESPONSE" | jq -r '.success // false')
              if [ "$SUCCESS" = "true" ]; then
                echo "DELETED $ID" | tee -a cleanup-result.txt
                DELETED_THIS_ROUND=$((DELETED_THIS_ROUND+1))
              else
                ERR=$(printf '%s' "$RESPONSE" | jq -c '.errors // .')
                echo "DELETE FAILED $ID :: $ERR" | tee -a cleanup-result.txt
              fi
              sleep 0.20
            done < <(printf '%s' "$JSON" | jq -r '.result[].id')

            # Refresh the first page after every batch. Deletions shift later rows forward.
            sleep 1
          done

          FINAL=$(curl -sS "$API/deployments" -H "$AUTH")
          FINAL_OK=$(printf '%s' "$FINAL" | jq -r '.success // false')
          if [ "$FINAL_OK" = "true" ]; then
            FINAL_TOTAL=$(printf '%s' "$FINAL" | jq -r '.result_info.total_count // (.result|length)')
            echo "FINAL TOTAL=$FINAL_TOTAL" | tee -a cleanup-result.txt
            printf '%s' "$FINAL" | jq -r '.result[] | "REMAINING \(.id) \(.created_on) \(.environment)"' | tee -a cleanup-result.txt
            [ "$FINAL_TOTAL" -eq 1 ] || FAIL=1
          else
            echo "FINAL LIST ERROR: $(printf '%s' "$FINAL" | jq -c '.errors // .')" | tee -a cleanup-result.txt
            FAIL=1
          fi
          echo "Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a cleanup-result.txt
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"

      - name: Save cleanup result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cleanup-result.txt
          git commit -m 'Record Cloudflare cleanup result' || exit 0
          git push

      - name: Require one deployment
        if: always()
        shell: bash
        run: |
          test "${{ steps.cleanup.outputs.fail }}" = "0"
