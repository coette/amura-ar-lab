name: Temporary full-source ZIP export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact AMURA AR production snapshot
        uses: actions/checkout@v4
        with:
          ref: 287a74173ba78e2040317596872f933fc413e379
          fetch-depth: 0

      - name: Create complete deployable ZIP
        run: git archive --format=zip --output=AMURA_AR_FULL_287a7417.zip HEAD

      - name: Upload complete ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AMURA_AR_FULL_287a7417
          path: AMURA_AR_FULL_287a7417.zip
          compression-level: 0
          retention-days: 1
