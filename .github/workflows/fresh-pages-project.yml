name: Create fresh AMURA Pages test project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fresh-pages-project.yml'
  workflow_dispatch:

jobs:
  deploy-fresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current lab
        run: npm run build

      - name: Create fresh Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if npx --yes wrangler@latest pages project list | grep -q '^amura-engine-r17'; then
            echo 'Project already exists'
          else
            npx --yes wrangler@latest pages project create amura-engine-r17 --production-branch=main
          fi

      - name: Deploy R17.1 to fresh project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy dist --project-name=amura-engine-r17 --branch=main
