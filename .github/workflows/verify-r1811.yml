name: Verify R18.1.2 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-r1811.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record Cloudflare production runtime checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          sleep 15
          BASE='https://amura-engine-2.pages.dev'
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/amura-engine-2"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          HTML=$(curl -sS "$BASE/?verify=r1812" || true)
          MASK=$(curl -sS "$BASE/forearm-mask-lab-v2.js?v=r18.1.2" || true)
          LIST=$(curl -sS "$API/deployments" -H "$AUTH" || true)
          PROJECT=$(curl -sS "$API" -H "$AUTH" || true)

          COUNT=$(printf '%s' "$LIST" | jq -r '.result_info.total_count // (.result|length) // -1' 2>/dev/null || echo -1)
          ACTIVE=$(printf '%s' "$PROJECT" | jq -r '.result.latest_deployment.id // ""' 2>/dev/null || true)

          contains(){ printf '%s' "$1" | grep -Fq "$2" && echo true || echo false; }
          HTML_OK=$(contains "$HTML" 'R18.1.2')
          HELPER_OK=$(contains "$MASK" 'function anchorGeometryLongitudinallyToPoint')
          LIVE_OK=$(contains "$MASK" 'p0Cut?.source === "VIVO"')
          ERROR_OK=$(contains "$MASK" 'p0CutErrorPx')

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg active "$ACTIVE" \
            --argjson deploymentCount "${COUNT:--1}" \
            --argjson publicHtmlR1812 "$HTML_OK" \
            --argjson p0AnchorHelperServed "$HELPER_OK" \
            --argjson liveP0AnchorServed "$LIVE_OK" \
            --argjson p0CutDiagnosticServed "$ERROR_OK" \
            '{generatedAt:$generatedAt,revision:"R18.1.2",deploymentCount:$deploymentCount,activeDeployment:$active,publicHtmlR1812:$publicHtmlR1812,p0AnchorHelperServed:$p0AnchorHelperServed,liveP0AnchorServed:$liveP0AnchorServed,p0CutDiagnosticServed:$p0CutDiagnosticServed}' \
            > cloudflare-diagnosis.json
          cat cloudflare-diagnosis.json

      - name: Save verification regardless of result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-diagnosis.json
          git commit -m 'Record R18.1.2 runtime verification' || exit 0
          git push
